name: Makefile CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 16379:6379
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11.1'

    - name: Install development tools
      run: make dev-install

    - name: Run checks
      run: make check

    - name: Run tests
      run: uv run make .pytest

    - name: Check coverage
      run: uv run make check-coverage

    - name: Generate coverage HTML report
      if: ${{ !cancelled() }}
      run: uv run coverage html

    - name: Upload coverage HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-report
        path: htmlcov/
