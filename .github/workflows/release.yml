name: Release
on:
  push:
    tags:
      - 'v*' # Triggers on version tags
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Git clean
        run: git clean -fdx

      - name: Build Portable Bundle
        run: make build-prodbundle

      - name: Get Version
        id: vars
        run: echo "pkg_version=$(uv version --short)" >> $GITHUB_OUTPUT

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ktp_controller-prodbundle-${{ steps.vars.outputs.pkg_version }}.zip
          body: "Relocatable release bundle. Download, extract, and run `./ktp-controller`."
