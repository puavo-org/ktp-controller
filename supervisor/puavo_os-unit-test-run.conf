[supervisord]
logfile = supervisord.log
pidfile = supervisord.pid
nodaemon=true
nocleanup=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file=ktp_controller_supervisor_sock
chmod=0700

[supervisorctl]
serverurl=unix://ktp_controller_supervisor_sock

[eventlistener:supervisor_chainer]
buffer_size=100
command=ktp-controller-supervisor-chainer '%(here)s/puavo_os-unit-test-run.conf' supervisor_chainer redis migratedb WAIT pytest WAIT SHUTDOWN
events=EVENT
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log

[program:redis]
command=redis-server --bind 127.0.0.1 --port 16379
autostart=false
autorestart=false
startsecs=5
startretries=0
stopasgroup=true
killasgroup=true
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log

[program:migratedb]
command=coverage run --context=unit-test --data-file=.coverage.alembic -m alembic -c ../../alembic.ini upgrade head
autostart=false
autorestart=false
startsecs=0
startretries=0
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true

[program:pytest]
command=../../aux/pytest-runner unit-test
autostart=false
autorestart=false
startretries=0
exitcodes=0
startsecs=0
stdout_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stopasgroup=true
killasgroup=true
