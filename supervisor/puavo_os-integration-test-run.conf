[supervisord]
logfile = supervisord.log
pidfile = supervisord.pid
nodaemon=True
nocleanup=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file=ktp_controller_supervisor_sock
chmod=0700

[supervisorctl]
serverurl=unix://ktp_controller_supervisor_sock

[eventlistener:ktp-controller-supervisor-chainer]
buffer_size=100
command=coverage run --context=integration-test --data-file=.coverage.ktp_controller.supervisor_chainer -m ktp_controller.supervisor_chainer '%(here)s/puavo_os-integration-test-run.conf' ktp-controller-supervisor-chainer ktp-controller-migratedb WAIT ktp-controller-redis ktp-controller-examomatic-mock ktp-controller-naksu2monitor ktp-controller-naksu2 ktp-controller-api ktp-controller-agent ktp-controller-wui ktp-controller-pytest WAIT SHUTDOWN
events=EVENT
stdout_logfile_maxbytes=0
stdout_logfile=/dev/null
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log

[program:ktp-controller-migratedb]
command=coverage run --context=integration-test --data-file=.coverage.alembic -m alembic -c ../../../alembic.ini upgrade head
autostart=false
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true

[program:ktp-controller-examomatic-mock]
command=coverage run --context=integration-test --data-file=.coverage.ktp_controller.examomatic.mock -m ktp_controller.examomatic.mock
autostart=false
autorestart=true
startsecs=5
startretries=999999
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true

[program:ktp-controller-naksu2]
command=/usr/bin/puavo-ers-naksu2
autostart=false
autorestart=true
startsecs=10
startretries=999999
stopsignal=INT
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true

[program:ktp-controller-naksu2monitor]
command=sh -c 'coverage run --context=integration-test --data-file=.coverage.ktp_controller.abitti2.naksu2monitor -m ktp_controller.abitti2.naksu2monitor && sleep 31'
autostart=false
autorestart=unexpected
startsecs=5
startretries=999999
exitcodes=0
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true

[program:ktp-controller-redis]
command=redis-server --bind 127.0.0.1 --port 16379
autostart=false
autorestart=true
startsecs=5
startretries=999999
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true

[program:ktp-controller-api]
command=coverage run --context=integration-test --data-file=.coverage.ktp_controller.api -m ktp_controller.api
autostart=false
autorestart=true
startsecs=5
startretries=999999
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true

[program:ktp-controller-agent]
command=coverage run --context=integration-test --data-file=.coverage.ktp_controller.agent -m ktp_controller.agent --testbed-mode
autostart=false
autorestart=true
startsecs=5
startretries=999999
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true
stopwaitsecs=20

[program:ktp-controller-wui]
command=coverage run --context=integration-test --data-file=.coverage.ktp_controller.wui -m ktp_controller.wui
autostart=false
autorestart=true
startsecs=5
startretries=999999
stdout_logfile_maxbytes=0
stdout_logfile=ktp-controller.log
stderr_logfile_maxbytes=0
stderr_logfile=ktp-controller.log
stopasgroup=true
killasgroup=true

[program:ktp-controller-pytest]
command=../../../aux/pytest-runner integration-test
autostart=false
autorestart=false
startretries=0
exitcodes=0
startsecs=0
stdout_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stopasgroup=true
killasgroup=true
