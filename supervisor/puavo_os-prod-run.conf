[supervisord]
logfile = logs/supervisord.log
pidfile = supervisord.pid
childlogdir = logs
nodaemon=True

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file=ktp_controller_supervisor_sock
chmod=0700

[supervisorctl]
serverurl=unix://ktp_controller_supervisor_sock

[program:migratedb]
command='%(here)s/ktp-controller' alembic -c '%(here)s/alembic.ini' upgrade head
autostart=true
autorestart=false
startsecs=0
exitcodes=0

[program:redis]
command=redis-server
autostart=false
autorestart=false
startsecs=10

[program:api]
command='%(here)s/ktp-controller' api
autostart=false
autorestart=false
startsecs=10

[program:agent]
command=sudo -g puavo -n '%(here)s/ktp-controller' agent
autostart=false
autorestart=false
startsecs=10

[eventlistener:chainer]
command='%(here)s/ktp-controller' chainer '%(here)s/puavo_os-prod-run.conf' migratedb WAIT redis api agent
events=PROCESS_STATE_RUNNING,PROCESS_STATE_EXITED,PROCESS_STATE_STOPPED,PROCESS_STATE_FATAL
