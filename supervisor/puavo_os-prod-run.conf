[supervisord]
logfile = logs/supervisord.log
pidfile = supervisord.pid
childlogdir = logs
nodaemon=True
nocleanup=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file=ktp_controller_supervisor_sock
chmod=0700

[supervisorctl]
serverurl=unix://ktp_controller_supervisor_sock

[eventlistener:supervisor_chainer]
buffer_size=100
command='%(here)s/ktp-controller' supervisor_chainer '%(here)s/puavo_os-prod-run.conf' supervisor_chainer migratedb WAIT abitti2server naksu2 redis api agent
events=EVENT

[program:migratedb]
command='%(here)s/ktp-controller' alembic -c '%(here)s/alembic.ini' upgrade head
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
startsecs=0
startretries=0
exitcodes=0

[program:redis]
command=redis-server
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
startretries=999999

[program:api]
command='%(here)s/ktp-controller' api
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
startretries=999999

[program:agent]
command=sudo -g puavo -n '%(here)s/ktp-controller' agent
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
startretries=999999

[program:naksu2]
command=/usr/bin/puavo-ers-naksu2
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=30
stopsignal=INT

[program:abitti2server]
command=/usr/bin/puavo-ers-abitti2server
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=30
startretries=999999
