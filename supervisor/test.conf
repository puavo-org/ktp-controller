[supervisord]
logfile = logs/supervisord.log
pidfile = supervisord.pid
childlogdir = logs
nodaemon=True
nocleanup=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file=ktp_controller_supervisor_sock
chmod=0700

[supervisorctl]
serverurl=unix://ktp_controller_supervisor_sock

[eventlistener:supervisor_chainer]
buffer_size=100
command=python3 -m ktp_controller.supervisor_chainer '%(here)s/test.conf' supervisor_chainer deletedb WAIT redis migratedb WAIT pytest WAIT SHUTDOWN
events=EVENT

[program:redis]
command=redis-server --bind 127.0.0.1 --port 16379
autostart=false
autorestart=false
startsecs=5
startretries=0
stopasgroup=true
killasgroup=true

[program:deletedb]
command=rm -vf tests/ktp_controller.sqlite dump.rdb
autostart=false
autorestart=false
startsecs=0
startretries=0
stdout_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stopasgroup=true
killasgroup=true

[program:migratedb]
command=alembic upgrade head
autostart=false
autorestart=false
startsecs=0
startretries=0
stdout_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stopasgroup=true
killasgroup=true

[program:pytest]
command=make .pytest
autostart=false
autorestart=false
startretries=0
exitcodes=0
startsecs=0
stdout_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stopasgroup=true
killasgroup=true
